name: Claude Code Review

# Uses `pull_request` (not `pull_request_target`). The Claude GitHub App's OIDC
# trust policy rejects tokens whose `sub` claim references `pull_request_target`,
# so the app-token exchange fails with "401 Invalid OIDC token" under that
# trigger. Fork PRs are not supported by this workflow.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress makes the action manage a single "progress" comment
          # and instructs the agent to ONLY update it ("never create new
          # comments"), which conflicts with the review flow below (inline
          # comments + a gh pr comment summary + a gh pr review verdict). Caught
          # between the two, the agent flailed — it even attempted git
          # commit/push — and never posted, leaving the progress comment frozen
          # with unchecked todos. Run without it so the prompt's posting
          # instructions are the only ones in effect.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a WordPress plugin codebase. Perform a thorough code review.

            ## Instructions
            1. First, run `gh pr diff ${{ github.event.pull_request.number }}` to see all changes
            2. Read and analyze every changed file carefully
            3. Use inline comments for specific code issues
            4. Post a summary comment at the end

            This is a READ-ONLY review. Explore with `gh pr diff/view`, `git
            diff/log/show/status`, and read tools only. Do NOT modify, add,
            commit, push, or delete any files — your only writes are inline
            comments, the summary comment, and the final `gh pr review` verdict.

            ## Security Review (CRITICAL - Check Every Item)
            - XSS vulnerabilities: unescaped output, missing esc_html/esc_attr/wp_kses
            - SQL injection: direct variable interpolation in queries, missing $wpdb->prepare()
            - CSRF: missing nonce verification on forms/AJAX
            - Sanitization ordering: HTML entities must be decoded BEFORE tag stripping
            - Input validation: validate and sanitize all user inputs
            - File operations: path traversal, unsafe file uploads
            - Authentication/authorization: capability checks, nonce validation

            ## Logic and Correctness
            - Off-by-one errors, boundary conditions
            - Null/undefined checks, type coercion issues
            - Validation logic flaws (e.g., incorrectly rejecting falsy values like 0, false, '0')
            - Race conditions, timing issues
            - Error handling gaps
            - Edge cases not covered

            ## Code Quality
            - DRY violations: duplicated code that should be extracted
            - Functions doing too many things
            - Missing or incorrect error handling
            - Inconsistent patterns within the codebase
            - Unused variables or dead code

            ## WordPress Best Practices
            - Proper hook usage and priorities
            - Correct use of WordPress APIs
            - Proper enqueueing of scripts/styles
            - Translation function usage

            ## Output Format
            For each issue found:
            1. Use `mcp__github_inline_comment__create_inline_comment` to add inline comments on specific lines
            2. Clearly state: SEVERITY (Critical/High/Medium/Low), the problem, and how to fix it

            Post a final summary comment using `gh pr comment` with:
            - Count of issues by severity
            - Key findings that need attention
            - Overall assessment

            Be thorough - a shallow review that misses real issues is worse than no review.
            If you find NO issues, explain what you checked and why the code is correct.

            ## Final Verdict
            After completing your review, submit a formal PR review:
            - If you find NO Critical or High severity issues, APPROVE the PR:
              `gh pr review ${{ github.event.pull_request.number }} --approve --body "your summary"`
            - If you find any Critical or High severity issues, REQUEST CHANGES:
              `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "your summary"`
            - If you only find Medium/Low issues worth noting but nothing blocking, COMMENT:
              `gh pr review ${{ github.event.pull_request.number }} --comment --body "your summary"`

          # Allowlist must cover read-only exploration (git diff/log/show,
          # cat/ls/find/grep, LS) in addition to the PR-posting tools —
          # otherwise the reviewer burns its turn budget on denied commands and
          # never publishes its findings or verdict. --max-turns gives the
          # thorough multi-file review room to finish after exploring.
          claude_args: |
            --max-turns 100
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Read,Grep,Glob,LS"
